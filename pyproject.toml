[project]
name = "discourse-reliability"
version = "0.1.0"
description = "Reliability audit toolkit for LLM Chinese connective-sense annotation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["requests>=2.31"]
dev = ["pytest>=8"]

[project.scripts]
discourse-reliability = "discourse_reliability.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
